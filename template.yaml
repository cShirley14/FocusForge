AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  FocusForge — Turn scattered tasks into forged, shipped work.
  All resources in one stack. `sam delete` removes everything.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 128
    Architectures:
      - arm64
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref TasksTable
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

Resources:
  # ─── Cognito (Auth) ───────────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub focusforge-users-${Stage}
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true  # No public signup — only you via CLI
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub focusforge-client-${Stage}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED  # Don't leak whether a user exists
      AccessTokenValidity: 1   # hours
      IdTokenValidity: 1       # hours
      RefreshTokenValidity: 7  # days
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ─── API Gateway ──────────────────────────────────────────────────────────────
  FocusForgeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173
          - !Sub https://${FrontendDistribution.DomainName}
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        MaxAge: 3600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 50

  # ─── DynamoDB ─────────────────────────────────────────────────────────────────
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub focusforge-tasks-${Stage}
      BillingMode: PAY_PER_REQUEST  # On-demand, scales to zero, free tier covers it
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: taskId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: taskId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true  # Free, protects against accidental deletes
      SSESpecification:
        SSEEnabled: true  # Encryption at rest (default, free)

  # ─── Lambda Functions ─────────────────────────────────────────────────────────

  # Create a task
  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub focusforge-create-task-${Stage}
      CodeUri: functions/tasks/
      Handler: create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref FocusForgeApi
            Path: /tasks
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - create.ts

  # List tasks for the current user
  ListTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub focusforge-list-tasks-${Stage}
      CodeUri: functions/tasks/
      Handler: list.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt TasksTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref FocusForgeApi
            Path: /tasks
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - list.ts

  # Update a task (status, title, etc.)
  UpdateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub focusforge-update-task-${Stage}
      CodeUri: functions/tasks/
      Handler: update.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !GetAtt TasksTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref FocusForgeApi
            Path: /tasks/{taskId}
            Method: PUT
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - update.ts

  # Delete a task
  DeleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub focusforge-delete-task-${Stage}
      CodeUri: functions/tasks/
      Handler: delete.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: !GetAtt TasksTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref FocusForgeApi
            Path: /tasks/{taskId}
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - delete.ts

  # Forge Master — AI task batching via Bedrock Nova Micro
  # ─── Bedrock Guardrail (OWASP LLM01/LLM02 defense) ────────────────────────
  ForgeGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub focusforge-guardrail-${Stage}
      Description: Prompt injection and content filtering for Forge Master
      BlockedInputMessaging: "Request blocked by safety filter."
      BlockedOutputsMessaging: "Response blocked by safety filter."
      ContentPolicyConfig:
        FiltersConfig:
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
          - Type: INSULTS
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: MISCONDUCT
            InputStrength: HIGH
            OutputStrength: HIGH

  ForgeGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt ForgeGuardrail.GuardrailId
      Description: Initial version

  ForgeMasterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub focusforge-forge-master-${Stage}
      CodeUri: functions/forge-master/
      Handler: index.handler
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
          GUARDRAIL_ID: !GetAtt ForgeGuardrail.GuardrailId
          GUARDRAIL_VERSION: !GetAtt ForgeGuardrailVersion.Version
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt TasksTable.Arn
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0
            - Effect: Allow
              Action:
                - bedrock:ApplyGuardrail
              Resource: !GetAtt ForgeGuardrail.GuardrailArn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref FocusForgeApi
            Path: /forge
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - index.ts

  # ─── Frontend Hosting (S3 + CloudFront) ────────────────────────────────────

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub focusforge-frontend-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub focusforge-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Security headers applied to every response (OWASP best practice)
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub focusforge-security-headers-${Stage}
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com https://cognito-idp.${AWS::Region}.amazonaws.com"
            Override: true

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${FocusForgeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient

  TasksTableName:
    Description: DynamoDB table name
    Value: !Ref TasksTable

  FrontendUrl:
    Description: CloudFront distribution URL
    Value: !Sub https://${FrontendDistribution.DomainName}

  FrontendBucketName:
    Description: S3 bucket for frontend assets
    Value: !Ref FrontendBucket
